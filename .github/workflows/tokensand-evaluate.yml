name: Tokens& workflow checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  evaluate:
    if: github.event_name == 'pull_request' || github.ref_name == github.event.repository.default_branch
    name: Evaluate offline workflow
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check this revision
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf '## Tokens& workflow checks\n\nRevision: `%s`\n\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          if [[ ! -f observe.workflow.mjs || -L observe.workflow.mjs ]]; then
            echo 'Setup required. Commit observe.workflow.mjs at the repository root with cases for your app.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
          tmp=$(mktemp -d)
          trap 'rm -rf -- "$tmp"' EXIT
          archive=https://github.com/giolux1235/tokensand-agent-pack/releases/download/workflow-check-0.1.19/tokensand-workflow-pr-0.1.19.tgz
          if ! curl -fsSL --proto '=https' --proto-redir '=https' --max-time 30 "$archive" -o "$tmp/check.tgz" ||
             ! echo "fdac98883a548e526cdc394d45633c3b69f1d6d3bd4f12f81906dd2788b1bc9b  $tmp/check.tgz" | sha256sum --check --status; then
            echo 'Checker unavailable. Retry this job to download the verified public release.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
          chmod 644 "$tmp/check.tgz"
          status=0
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user 65534:65534 --pids-limit 64 --cpus 1 --memory 512m --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --volume "$GITHUB_WORKSPACE:/src:ro" --volume "$tmp/check.tgz:/check.tgz:ro" \
            node:24-bookworm@sha256:2f6533894e81c654764273b03a065aa3265fa50db292ba8348b6c4bb77233e98 \
            sh -ec 'mkdir /tmp/repo && cp -R /src/. /tmp/repo/ && cd /tmp && tar -xzf /check.tgz && cd repo && node /tmp/package/starter-pr.mjs record' \
            > "$tmp/result" 2>/dev/null || status=$?
          # The scorer runs application callbacks privately. Publish only its validated revision and counters.
          python3 -I - "$status" "$SOURCE_SHA" "$tmp/result" "$GITHUB_STEP_SUMMARY" <<'PY'
          import re, sys
          from pathlib import Path

          exit_code, revision, result, summary = sys.argv[1:]
          path = Path(result)
          report = path.read_bytes().decode("utf-8", "replace") if path.stat().st_size <= 4096 else ""
          def field(label, pattern):
              matches = [line[len(label):] for line in report.splitlines() if line.startswith(label)]
              return re.fullmatch(pattern, matches[0]) if len(matches) == 1 else None

          state = field("Status: ", r"\*\*([a-z]+)\*\*")
          state = state[1] if state else ""
          sha = r"`([a-f0-9]{40})`"
          checkout, evaluated = field("Checkout: ", sha), field("Evaluated revision: ", sha)
          same_head = bool(checkout and checkout[1] == revision)
          bound = same_head and evaluated and evaluated[1] == revision
          complete_label, partial_label = "Author-reported candidate cases: ", "Candidate cases: "
          number = r"(0|[1-9][0-9]{0,5})"
          complete = field(complete_label, number + " passed, " + number + r" failed\.")
          partial = field(partial_label, ", ".join(number + " " + key for key in ["total", "passed", "failed", "unscored", "both"]) + r"\.")
          has_complete = any(line.startswith(complete_label) for line in report.splitlines())
          has_partial = any(line.startswith(partial_label) for line in report.splitlines())
          code = 2
          message = "Invalid checker result. Run npm run test:tokensand locally and check the workflow setup."
          if bound and complete and not has_partial:
              passed, failed = map(int, complete.groups())
              if passed + failed and (state, exit_code) == (("failed", "100") if failed else ("passed", "0")):
                  code = 1 if failed else 0
                  action = "Run npm run test:tokensand locally for the failing cases." if failed else "Review this revision for release."
                  message = f"Passed {passed}/{passed + failed} · Failed {failed}. {action}"
          elif bound and partial and not has_complete and exit_code == "1":
              total, passed, failed, unscored, both = map(int, partial.groups())
              if unscored and both <= min(failed, unscored) and total == passed + failed + unscored - both and state == ("mixed" if failed else "unscored"):
                  code = 1 if failed else 2
                  action = "Fix the failing cases and restore the unscored checks." if failed else "Restore the unscored checks."
                  overlap = f" ({both} in both counts)" if both else ""
                  message = f"Passed {passed}/{total} · Failed {failed} · Unscored {unscored}{overlap}. {action} Run npm run test:tokensand locally for names."
          elif same_head and state == "setup" and exit_code == "2":
              message = "Setup required. Commit observe.workflow.mjs at the repository root with cases for your app."
          elif (same_head and state == "stale" and exit_code == "3") or (checkout and evaluated and checkout[1] == evaluated[1] != revision):
              message = "Stale revision. Rerun this job for the current commit."
          elif exit_code in {"125", "126", "127"}:
              message = "Runner unavailable. Retry this job or run npm run test:tokensand locally."
          print(message)
          with open(summary, "a") as out:
              print(message, file=out)
          sys.exit(code)
          PY
